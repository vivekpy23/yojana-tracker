name: Daily data update

on:
  schedule:
    - cron: "17 1 * * *"   # 06:47 IST every day
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: fetch-cache-${{ github.run_id }}
          restore-keys: fetch-cache-

      - run: pip install -r scraper/requirements.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Scrape, verify, build
        id: run
        run: python -m scraper.run

      # Nothing uncertain: publish straight to main.
      - name: Commit to main
        if: steps.run.outputs.needs_review == 'false'
        run: |
          git config user.name "yojana-bot"
          git config user.email "yojana-bot@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Daily data update $(date -u +%F)"
          git push

      # Something needs a human: open (or refresh) a pull request instead.
      - name: Open review pull request
        if: steps.run.outputs.needs_review == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/review
          delete-branch: true
          add-paths: |
            data
            site/data
          commit-message: "Data update – needs review"
          title: "Data update: figures waiting for your review"
          body: |
            The daily run found figures it could not verify automatically.

            **How to review**
            1. Open `data/review_queue.json` in this PR (Files changed → ⋯ → Edit file).
            2. For each item compare `news_sentence` with `govt_snippet` / `govt_url`.
            3. Set `"decision": "approve"` or `"reject"`. To publish a different number, also set `"use_amount"`.
            4. Commit to this branch and merge. The next daily run applies your decisions.

            Items you leave as `null` stay in the queue. Everything else in this PR is the normal daily update.
          labels: data-review
