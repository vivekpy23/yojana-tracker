name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**"]
  # Pushes made by the daily job's GITHUB_TOKEN don't trigger `push` workflows,
  # so also deploy whenever that job finishes.
  workflow_run:
    workflows: ["Daily data update"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # A new URL per deploy, so browsers don't keep the previous app.js / styles.css (Pages caches 10 min).
      - name: Version asset URLs
        run: sed -i "s/\(app\.js\|styles\.css\)\"/\1?v=$(git rev-parse --short HEAD)\"/g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
