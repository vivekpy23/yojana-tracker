# Shared source registry (scraper/registry.py). Data, not code: one entry shape for every jurisdiction.
#
#   domains    the jurisdiction's own government domains. A page on one of them (or a subdomain) is an official
#              source for that jurisdiction: verification evidence, and `site:` targets for verification searches.
#              Any .gov.in / .nic.in page also counts as official (config.yaml → govt_domains); these entries add
#              which jurisdiction it belongs to.
#   newsrooms  official press-release / news listings, monitored every run outside the search quota. Only the
#              listing URL is needed: the item-URL pattern is inferred from the listing's links and the text is read
#              with generic main-content extraction. Optional per-site adapter keys, only where the generic way fails:
#              item_pattern, item_url, content_selector, backfill (default true), lang.
#
# Portal domains are the states' main government portals; check a newsroom URL in a browser before adding it.
