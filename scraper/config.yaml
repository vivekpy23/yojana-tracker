# Yojana Tracker – scraper configuration
# Financial year the site reports on (last completed FY).
fy: "2025-26"

# Step 1a – scheme discovery (data/catalog.json). myScheme is the primary source, searched per State/UT;
# the National Portal of India is secondary. Neither supplies amounts.
myscheme:
  # Search API behind myscheme.gov.in/search. Called only when MYSCHEME_API_KEY holds a key issued to this
  # project (API Setu / myScheme team); otherwise the step is skipped and logged.
  search_api: "https://api.myscheme.gov.in/search/v4/schemes"
  api_key_env: MYSCHEME_API_KEY
  page_size: 50
  max_per_state: 1000
  cache_h: 144                 # re-list each state at most every 6 days
  state_names:                 # where myScheme spells a State/UT differently from seed.json
    JK: "Jammu and Kashmir"

national_portal:
  cache_h: 144
  # Listing pages read for scheme links, per State/UT or CENTRE. india.gov.in refused this crawler
  # (Access Denied) in Oct 2026 – confirm the URLs once access works, and add state pages.
  pages:
    CENTRE: ["https://www.india.gov.in/my-government/schemes"]

discovery:
  max_allocation_reviews_per_state: 10   # catalog schemes found in govt documents, queued per run

# Step 1b – news discovery. Every article becomes a report on its scheme (new / existing / revised allocation /
# disbursement update). Only the link, headline, date and extracted facts are stored, never article text.
# The FY of a story is the one it names, else the FY of its date (the coming FY for a Jan–Mar budget story);
# only stories about the site's FY are verified for the site, the rest are kept as reports for their own FY.
# `fetch_article: false` reads just the RSS headline + summary (for outlets whose terms don't allow fetching).
# `state` is a hint for state-desk feeds. Google News RSS is not used: its robots.txt disallows /rss.
news_feeds:
  - {name: "PIB (English releases)", url: "https://pib.gov.in/RssMain.aspx?ModId=6&Lang=1&Regid=3", govt: true}
  # national
  - {name: "The Hindu – National", url: "https://www.thehindu.com/news/national/feeder/default.rss"}
  - {name: "The Hindu – Economy", url: "https://www.thehindu.com/business/Economy/feeder/default.rss"}
  - {name: "The Hindu – Other States", url: "https://www.thehindu.com/news/national/other-states/feeder/default.rss"}
  - {name: "Indian Express – India", url: "https://indianexpress.com/section/india/feed/"}
  - {name: "Business Standard – Economy", url: "https://www.business-standard.com/rss/economy-102.rss"}
  - {name: "Hindustan Times – India", url: "https://www.hindustantimes.com/feeds/rss/india-news/rssfeed.xml"}
  # state desks
  - {name: "The Hindu – Tamil Nadu", url: "https://www.thehindu.com/news/national/tamil-nadu/feeder/default.rss", state: TN}
  - {name: "The Hindu – Karnataka", url: "https://www.thehindu.com/news/national/karnataka/feeder/default.rss", state: KA}
  - {name: "Indian Express – Mumbai", url: "https://indianexpress.com/section/cities/mumbai/feed/", state: MH}
  # regional languages
  - {name: "Dainik Bhaskar – Desh", url: "https://www.bhaskar.com/rss-v1--category-1061.xml", lang: hi}
  - {name: "Amar Ujala – India", url: "https://www.amarujala.com/rss/india-news.xml", lang: hi}
  - {name: "NDTV Khabar", url: "https://feeds.feedburner.com/ndtvkhabar-latest", lang: hi}
  - {name: "Oneindia Hindi", url: "https://hindi.oneindia.com/rss/feeds/hindi-news-fb.xml", lang: hi}
  - {name: "ABP Majha – Maharashtra", url: "https://marathi.abplive.com/news/maharashtra/feed", lang: mr, state: MH}
  - {name: "Oneindia Marathi", url: "https://marathi.oneindia.com/rss/feeds/marathi-news-fb.xml", lang: mr}
  - {name: "Oneindia Tamil", url: "https://tamil.oneindia.com/rss/feeds/tamil-news-fb.xml", lang: ta}
  - {name: "Oneindia Kannada", url: "https://kannada.oneindia.com/rss/feeds/kannada-news-fb.xml", lang: kn}

# State government announcements: press-release index pages, read one level deep for links matching
# `announcement_keywords` (government domains only). Confirm these URLs once – department sites move.
announcement_pages:
  - {name: "Maharashtra DGIPR", url: "https://dgipr.maharashtra.gov.in/", state: MH}
  - {name: "UP Information Department", url: "https://information.up.gov.in/", state: UP}
  - {name: "Tamil Nadu DIPR", url: "https://www.tndipr.gov.in/", state: TN}
  - {name: "Karnataka DIPR", url: "https://dipr.karnataka.gov.in/", state: KA}
  - {name: "Rajasthan DIPR", url: "https://dipr.rajasthan.gov.in/", state: RJ}
announcement_keywords: ["press", "release", "yojana", "scheme", "प्रेस", "विज्ञप्ति", "योजना", "செய்தி", "ಪತ್ರಿಕಾ"]

# Step 1c – search-first discovery (scraper/search.py), official newsrooms from the shared registry
# (data/registry.yaml, scraper/newsroom.py), checkpointed between runs (data/discovery_state.json).
# Start small and evaluate discovery quality (data/coverage.json) before raising budgets.
search:
  providers:                       # in order; a provider without its key is skipped and logged
    - name: brave                  # primary: web index, site:, freshness. ~$5 per 1,000 requests
      enabled: true
      api_key_env: BRAVE_API_KEY
      discovery_per_jurisdiction: 1   # per jurisdiction per day: 31 states/UTs + the Union = 32 a day
      verification_per_day: 3         # targeted site: searches for unverified figures, separate budget
      monthly_cap: 1000               # both purposes; roughly Brave's monthly free credit
      freshness: pw                   # daily discovery looks at the past week only
    - name: bing_news              # keyless supplement (recent news only, no site:), same daily rule
      enabled: true
      discovery_per_jurisdiction: 1
      verification_per_day: 0
      cache_h: 12
    - name: google_cse             # only for an existing key (closed to new customers, ends 1 Jan 2027)
      enabled: true
      api_key_env: GOOGLE_CSE_KEY
      cx_env: GOOGLE_CSE_CX
      discovery_per_jurisdiction: 0
      verification_per_day: 0
  results_per_query: 10
  max_pages_per_jurisdiction: 15   # new pages read per jurisdiction per run from search results
  query_cache_days: 7              # the same query on the same provider is not repeated within this
  languages:                       # query languages per jurisdiction ({name} is written in that language)
    default: [en, hi]
    MH: [en, mr, hi]
    TN: [en, ta]
    KA: [en, kn]
    KL: [en]
    WB: [en]
    AS: [en]
    OD: [en]
    AP: [en]
    TS: [en]
    PB: [en, hi]
    MN: [en]
    ML: [en]
    MZ: [en]
    NL: [en]
    SK: [en]
    TR: [en]
    AR: [en]
    GA: [en]
    PY: [en]
    JK: [en, hi]
  jurisdiction_names:
    CENTRE: {en: "Union government", hi: "केंद्र सरकार"}
  daily:
    templates:                     # one is chosen per jurisdiction per day (theme × language, rotated)
      new_schemes:
        en: '{name} new scheme launched yojana beneficiaries'
        hi: '{name} नई योजना शुरू लाभार्थी'
        mr: '{name} नवीन योजना सुरू लाभार्थी'
        ta: '{name} புதிய திட்டம் தொடக்கம் பயனாளிகள்'
        kn: '{name} ಹೊಸ ಯೋಜನೆ ಆರಂಭ ಫಲಾನುಭವಿ'
      announcements:
        en: '{name} announces welfare scheme crore'
        hi: '{name} सरकार योजना घोषणा करोड़'
        mr: '{name} सरकार योजना घोषणा कोटी'
        ta: '{name} அரசு திட்டம் அறிவிப்பு கோடி'
        kn: '{name} ಸರ್ಕಾರ ಯೋಜನೆ ಘೋಷಣೆ ಕೋಟಿ'
      disbursements:
        en: '{name} scheme crore transferred to beneficiaries accounts'
        hi: '{name} योजना करोड़ राशि खाते में अंतरित'
        mr: '{name} योजना कोटी रक्कम खात्यात जमा'
        ta: '{name} திட்டம் கோடி வங்கி கணக்கில் வரவு'
        kn: '{name} ಯೋಜನೆ ಕೋಟಿ ಖಾತೆಗೆ ಜಮಾ'
  verification:
    template: '"{scheme}" site:{domain}'
    min_amount_cr: 50              # figures below this aren't worth a paid search
    retry_days: 14                 # the same figure is searched for at most every 14 days

run:
  time_budget_min: 35              # web discovery stops (checkpointed) after this; the job's limit is 45 min

# AI-assisted extraction (scraper/llm.py) of schemes and typed financial claims from unstructured text. Needs the
# `anthropic` package and credentials (ANTHROPIC_API_KEY or `ant auth login`). Every claim it returns must quote
# the source verbatim and the amount must parse from that quote, or it is dropped. Rule-based extraction always runs.
ai_extraction:
  enabled: true
  model: claude-opus-5-5
  effort: medium
  max_chars: 100000

# Funding type of each scheme (catalog.py). A name matching one of these patterns is a Centrally Sponsored
# Scheme (Centre + state share): the umbrella schemes in the Union Budget's statement of Centrally Sponsored
# Schemes. Review when a new Union Budget changes the list.
funding:
  centrally_sponsored:
    - 'MGNREG|Mahatma Gandhi National Rural Employment'
    - 'National Social Assistance|\bNSAP\b|Indira Gandhi National (Old Age|Widow|Disability) Pension'
    - 'Pradhan Mantri Awas|\bPMAY|PM Awas'
    - 'Pradhan Mantri Gram Sadak|\bPMGSY\b'
    - 'Jal Jeevan Mission'
    - 'Swachh Bharat Mission'
    - 'National Health Mission|\bNHM\b'
    - 'Samagra Shiksha'
    - 'PM POSHAN|Mid[- ]Day Meal'
    - 'Integrated Child Development|\bICDS\b|Saksham Anganwadi|Poshan 2\.0'
    - 'Mission Shakti|Mission Vatsalya|Matru Vandana'
    - 'Ayushman Bharat|PM-?JAY\b'
    - 'National Rural Livelihood|DAY-NRLM|Deendayal Antyodaya'
    - 'Rashtriya Krishi Vikas'
    - 'Pradhan Mantri Krishi Sinchai|\bPMKSY\b|Per Drop More Crop'
    - '\bAMRUT\b|Atal Mission for Rejuvenation'
    - 'PM SHRI|PM-USHA|Rashtriya Uchchatar Shiksha'
    - 'Post[- ]Matric Scholarship'
    - 'PM-?AJAY|Anusuchit Jaati Abhyuday'
    - 'Matsya Sampada|National Livestock Mission|Rashtriya Gokul'
  # Set by hand where the sources are clear; key = scheme / catalog id.
  overrides:
    KA-five-guarantee-schemes: {funding: state, evidence: "Karnataka's own guarantee schemes, funded from the state budget"}
    TN-kalaignar-magalir-urimai-thogai: {funding: state, evidence: "Tamil Nadu's own scheme, funded from the state budget"}
    TN-vidiyal-payanam: {funding: state, evidence: "Tamil Nadu's own scheme, funded from the state budget"}
    TN-pudhumai-penn-thittam: {funding: state, evidence: "Tamil Nadu's own scheme, funded from the state budget"}

# Other names the same scheme appears under (English spellings, regional-language names), so reports of it
# deduplicate. Canonical name first.
scheme_aliases:
  MH:
    "Mukhyamantri Majhi Ladki Bahin Yojana": ["Ladki Bahin Yojana", "Ladki Behen Yojana", "Ladki Bahin scheme",
                                              "Ladki Behen scheme", "माझी लाडकी बहीण योजना", "लाडकी बहीण योजना"]
  TN:
    "Kalaignar Magalir Urimai Thogai": ["Kalaignar Magalir Urimai Thogai Thittam", "Magalir Urimai Thogai", "KMUT",
                                        "கலைஞர் மகளிர் உரிமைத் திட்டம்", "கலைஞர் மகளிர் உரிமைத் தொகை திட்டம்"]
    "Vidiyal Payanam (free bus travel for women)": ["Vidiyal Payanam", "விடியல் பயணம் திட்டம்"]
    "Pudhumai Penn Thittam": ["Pudhumai Penn scheme", "புதுமைப் பெண் திட்டம்"]
    "Chief Minister's Breakfast Scheme (expansion)": ["CM Breakfast Scheme", "முதலமைச்சரின் காலை உணவுத் திட்டம்"]
  KA:
    "Five guarantee schemes (Gruha Lakshmi, Gruha Jyothi, Shakti, Anna Bhagya, Yuva Nidhi)": ["guarantee schemes", "five guarantees"]
  UP:
    "Mukhyamantri Kanya Sumangala Yojana": ["Kanya Sumangala Yojana", "मुख्यमंत्री कन्या सुमंगला योजना", "कन्या सुमंगला योजना"]
    "Mukhyamantri Samuhik Vivah Yojana (mass marriage)": ["Samuhik Vivah Yojana", "मुख्यमंत्री सामूहिक विवाह योजना"]

# Step 2 – verification: only documents on these domains count as government sources.
govt_domains: [".gov.in", ".nic.in"]

# Where to look for each jurisdiction's official documents.
# `index_pages` are crawled one level deep for budget PDFs/HTML whose link text or URL
# matches `doc_keywords`. Confirm these URLs once — department sites move around.
govt_sources:
  CENTRE:
    index_pages:
      - "https://www.indiabudget.gov.in/"
      - "https://www.indiabudget.gov.in/budget2026-27/"
    direct_docs:
      - "https://www.indiabudget.gov.in/doc/Budget_at_Glance/bag1.pdf"
  # `notification_pages` (optional): government-order, gazette or departmental-report listings, read like index_pages.
  MH:
    index_pages: ["https://finance.maharashtra.gov.in/"]
  UP:
    index_pages: ["https://budget.up.nic.in/"]
  TN:
    index_pages: ["https://www.tnbudget.tn.gov.in/"]
  KA:
    index_pages: ["https://finance.karnataka.gov.in/"]
  RJ:
    index_pages: ["https://finance.rajasthan.gov.in/"]

doc_keywords: ["budget", "speech", "2025-26", "2025-2026", "demand", "estimates", "glance", "highlights",
               "notification", "government order", "annual report", "outcome budget"]

# Matching thresholds (rapidfuzz partial_ratio, 0–100)
match:
  verified_min_score: 90     # name match at/above this + amount found → verified
  review_min_score: 72       # between review_min and verified_min → review queue
  amount_tolerance: 0.005    # 0.5 % – rounding differences between news and documents
  window_chars: 400          # how far from the scheme name to look for an amount

# CAG state accounts – 'Monthly Key Indicators' (Accounts at a Glance). The March report of the FY
# is the full-year provisional actual. PDFs are served from CAG's CDN, so only links found on the
# cag.gov.in state pages and hosted on `pdf_hosts` are accepted.
cag:
  index_pages:
    - "https://cag.gov.in/en/state-accounts-report"
    - "https://cag.gov.in/en/state-accounts-report?show_ut_only=1"
  pdf_hosts: ["d7i5wg8xwe4hf.cloudfront.net"]
  state_names:   # seed.json code -> link text on the CAG index pages
    MH: Maharashtra
    UP: Uttar Pradesh
    TN: Tamil Nadu
    KA: Karnataka
    RJ: Rajasthan
    AP: Andhra Pradesh
    AR: Arunachal Pradesh
    AS: Assam
    BR: Bihar
    CG: Chhattisgarh
    GA: Goa
    GJ: Gujarat
    HR: Haryana
    HP: Himachal Pradesh
    JH: Jharkhand
    KL: Kerala
    MP: Madhya Pradesh
    MN: Manipur
    ML: Meghalaya
    MZ: Mizoram
    NL: Nagaland
    OD: Odisha
    PB: Punjab
    SK: Sikkim
    TS: Telangana
    TR: Tripura
    UK: Uttarakhand
    WB: West Bengal
    DL: Delhi
    JK: "Jammu and Kashmir UT (31-Oct-2019 Onwards)"
    PY: Pondicherry

# PRS state budget analyses. The analysis of next year's budget carries this FY's revised estimates
# (budget, own tax, Social Welfare & Nutrition). States without a slug have no PRS analysis.
prs:
  url: "https://prsindia.org/budgets/states/{slug}-budget-analysis-{year}"
  # Scheme discovery: PRS's analyses of the FY's own budget, as listed here.
  listing_url: "https://prsindia.org/budgets/states?budget_year={fy}&state=all"
  slugs:
    MH: maharashtra
    UP: uttar-pradesh
    TN: tamil-nadu
    KA: karnataka
    RJ: rajasthan
    AP: andhra-pradesh
    AR: arunachal-pradesh
    AS: assam
    BR: bihar
    CG: chhattisgarh
    GA: goa
    GJ: gujarat
    HR: haryana
    HP: himachal-pradesh
    JH: jharkhand
    KL: kerala
    MP: madhya-pradesh
    MN: manipur
    ML: meghalaya
    MZ: mizoram
    NL: nagaland
    OD: odisha
    PB: punjab
    SK: sikkim
    TS: telangana
    TR: tripura
    UK: uttarakhand
    WB: west-bengal
    DL: delhi
    JK: jammu-and-kashmir
    # PY: no PRS analysis for Puducherry

# Pilot jurisdictions processed by the daily run.
pilot_states: [MH, UP, TN, KA, RJ]

http:
  user_agent: "YojanaTrackerBot/0.1 (+https://github.com/<you>/yojana-tracker; public-interest research)"
  timeout_s: 30
  delay_s: 2.0               # polite pause between requests to the same host (robots.txt Crawl-delay wins if longer)
  retries: 2                 # timeouts, connection errors and 500/502/504 are retried, after 2 s then 6 s
  retry_backoff_s: 2.0
  max_docs_per_source: 25
  max_articles_per_source: 40   # articles read per feed / announcement page per run
  max_requests_per_host: 300    # network requests to one host per run (cache hits don't count)
