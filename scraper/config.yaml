  slugs:
    MH: maharashtra
    UP: uttar-pradesh
    TN: tamil-nadu
    KA: karnataka
    RJ: rajasthan
    AP: andhra-pradesh
    AR: arunachal-pradesh
    AS: assam
    BR: bihar
    CG: chhattisgarh
    GA: goa
    GJ: gujarat
    HR: haryana
    HP: himachal-pradesh
    JH: jharkhand
    KL: kerala
    MP: madhya-pradesh
    MN: manipur
    ML: meghalaya
    MZ: mizoram
    NL: nagaland
    OD: odisha
    PB: punjab
    SK: sikkim
    TS: telangana
    TR: tripura
