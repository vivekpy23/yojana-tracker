    # PY: no PRS analysis for Puducherry

# Pilot jurisdictions processed by the daily run.
pilot_states: [MH, UP, TN, KA, RJ]

http:
  user_agent: "YojanaTrackerBot/0.1 (+https://github.com/<you>/yojana-tracker; public-interest research)"
  timeout_s: 30
  delay_s: 2.0               # polite pause between requests to the same host (robots.txt Crawl-delay wins if longer)
  max_docs_per_source: 25
  max_articles_per_source: 40   # articles read per feed / announcement page per run
  max_requests_per_host: 300    # network requests to one host per run (cache hits don't count)
