    JK: "Jammu and Kashmir UT (31-Oct-2019 Onwards)"
    PY: Pondicherry

# PRS state budget analyses. The analysis of next year's budget carries this FY's revised estimates
# (budget, own tax, Social Welfare & Nutrition). States without a slug have no PRS analysis.
prs:
